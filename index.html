<!doctype html>
<html lang="mr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Applied Gyan</title>
<meta name="description" content="Applied Gyan — आम्हां घरीं धन शब्दांचीच रत्नें.">
<meta name="theme-color" content="#ffffff">
<meta property="og:type" content="website">
<meta property="og:title" content="Applied Gyan">
<meta property="og:description" content="आम्हां घरीं धन शब्दांचीच रत्नें ।">
<meta property="og:image" content="https://appliedgyan.com/images/og.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:url" content="https://appliedgyan.com/">
<link rel="icon" type="image/png" href="images/favicon.png">
<link rel="apple-touch-icon" href="images/icon-180.png">
<link rel="preload" href="fonts/Sharad76.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face{font-family:'Sharad76';src:url(fonts/Sharad76.woff2) format('woff2');font-display:swap}
:root{--ink:#1b1b1d;--blue:#1d3a78;--soft:#9aa3b2}
*{box-sizing:border-box}
html,body{margin:0;background:#fff;color:var(--ink)}
body{min-height:100svh;display:flex;flex-direction:column;align-items:center;
  padding:max(10vh,52px) 16px calc(max(6vh,32px) + env(safe-area-inset-bottom));
  font-family:'Sharad76','Noto Serif Devanagari','Nirmala UI','Mangal',serif}

.logo{width:min(52vw,260px);height:auto;display:block}

.stroke{display:block;width:min(40vw,190px);height:auto;margin:clamp(40px,8vh,72px) auto clamp(34px,6vh,60px);overflow:visible}
.stroke path{fill:none;stroke:var(--blue);stroke-linecap:round;opacity:.7}

.abhang{margin:0;text-align:center;font-size:clamp(20px,5.2vw,30px);line-height:2.05}
.abhang .c{margin:0 0 clamp(18px,3.4vh,30px)}
.abhang .c:last-child{margin-bottom:0}
.abhang span{display:block}
.n{color:var(--blue);margin-left:.25em;white-space:nowrap;font-weight:400}

.mail{margin-top:auto;padding-top:clamp(48px,9vh,84px);display:flex;justify-content:center}
.mail a{display:grid;place-items:center;width:48px;height:48px;border-radius:50%;color:var(--soft);
  transition:color .2s, transform .2s;-webkit-tap-highlight-color:transparent}
.mail a:hover,.mail a:focus-visible{color:var(--blue);transform:translateY(-1px)}
.mail a:focus-visible{outline:1.5px solid var(--blue);outline-offset:2px}
.mail svg{width:28px;height:28px;overflow:visible}
.mail path{fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}

.reveal{opacity:0;transform:translateY(6px);animation:in 1.1s ease forwards}
.d1{animation-delay:.15s}.d2{animation-delay:.9s}.d3{animation-delay:1.5s}.d4{animation-delay:2.1s}.d5{animation-delay:2.7s}.d6{animation-delay:3.3s}
@keyframes in{to{opacity:1;transform:none}}
.stroke path{stroke-dasharray:420;stroke-dashoffset:420;animation:draw 1.6s ease .6s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
@media (prefers-reduced-motion: reduce){.reveal{opacity:1;transform:none;animation:none}.stroke path{stroke-dashoffset:0;animation:none}}
</style>
</head>
<body>

<img class="logo reveal d1" src="images/logo.png" width="640" height="649" alt="Applied Gyan">

<svg class="stroke reveal d2" viewBox="0 0 220 24" aria-hidden="true">
  <defs><filter id="w" x="-5%" y="-50%" width="110%" height="200%">
    <feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="2" seed="4"/>
    <feDisplacementMap in="SourceGraphic" scale="2.2"/></filter></defs>
  <g filter="url(#w)">
    <path d="M6 15 C 50 9, 96 7, 140 9 S 196 14, 214 11" stroke-width="2.4"/>
    <path d="M40 17 C 80 13, 120 12, 168 14" stroke-width="1" opacity=".45"/>
  </g>
</svg>

<div class="abhang" lang="mr">
  <p class="c reveal d3"><span>आम्हां घरीं धन शब्दांचीच रत्नें ।</span><span>शब्दांचीच शस्त्रें यत्ने करूं <b class="n">॥१॥</b></span></p>
  <p class="c reveal d4"><span>शब्द चि आमुच्या जीवाचें जीवन ।</span><span>शब्दें वांटूं धन जनलोकां <b class="n">॥२॥</b></span></p>
  <p class="c reveal d5"><span>तुका म्हणे पाहा शब्द चि हा देव ।</span><span>शब्दें चि गौरव पूजा करूं <b class="n">॥३॥</b></span></p>
</div>

<div class="mail reveal d6">
  <a href="mailto:vishakha.naik@gmail.com" aria-label="ईमेल पाठवा" title="ईमेल">
    <svg viewBox="0 0 28 28" aria-hidden="true">
      <defs><filter id="h" x="-10%" y="-10%" width="120%" height="120%">
        <feTurbulence type="fractalNoise" baseFrequency="0.09" numOctaves="2" seed="2"/>
        <feDisplacementMap in="SourceGraphic" scale="1.2"/></filter></defs>
      <g filter="url(#h)">
        <path d="M3.5 7.2 C 10 6.6, 18 6.6, 24.6 7.1 C 24.9 11.5, 24.8 16.6, 24.4 21 C 17.8 21.4, 10.2 21.4, 3.7 20.9 C 3.3 16.4, 3.2 11.6, 3.5 7.2 Z"/>
        <path d="M4 7.8 C 8 11.2, 11.2 13.6, 14 15.2 C 17 13.5, 20.3 11, 24.1 7.6"/>
      </g>
    </svg>
  </a>
</div>

</body>
</html>
